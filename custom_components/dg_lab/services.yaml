add_intensity:
  fields:
    entity_id:
      required: false
      selector:
        entity:
          filter:
            integration: dg_lab
            domain: number
          multiple: true
    value:
      required: true
      selector:
        number:
          min: -100
          max: 100
          step: 1
          mode: box
    operation_options:
      collapsed: true
      fields:
        priority:
          required: false
          selector:
            select:
              options:
                - label: Priority 0
                  value: "0"
                - label: Priority 1
                  value: "1"
                - label: Priority 2
                  value: "2"
        immediate:
          required: false
          selector:
            boolean:
        timeout:
          required: false
          selector:
            number:
              min: 0.1
              max: 86400
              step: 0.1
              unit_of_measurement: s
              mode: box
    advanced_targeting:
      collapsed: true
      fields:
        config_entry_id:
          required: false
          selector:
            config_entry:
              integration: dg_lab
        client_id:
          required: false
          selector:
            text:
        slot_id:
          required: false
          selector:
            text:
        channel:
          required: false
          selector:
            select:
              options:
                - label: Channel A
                  value: A
                - label: Channel B
                  value: B

